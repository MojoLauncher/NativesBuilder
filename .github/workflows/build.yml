name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Install CMake
        uses: lukka/get-cmake@v3.26.0
      - name: Setup CCache
        uses: jianmingyong/ccache-action@v1
        with:
          ccache-key-prefix: ccache_cache_
          max-size: 150M
      - name: Apply ZSTD patches
        run: |
          pushd ./app/src/main/zstd; git apply --verbose --ignore-space-change --ignore-whitespace ../../../../patches/zstd-dh/break_droidcringe.patch; git apply --verbose --ignore-space-change --ignore-whitespace ../../../../patches/zstd/*.patch; popd
            
      - name: Prepare ZSTD for DH
        run: bash ./patches/zstd-dh/prepare.sh
      - name: Apply rnnoise4j-svc patches
        run: |
          pushd ./app/src/main/rnnoise4j-svc; git apply --verbose --ignore-space-change --ignore-whitespace ../../../../patches/rnnoise4j-svc/*.patch; popd
      - name: Apply lame4j-svc patches
        run: |
          pushd ./app/src/main/lame4j-svc; git apply --verbose --ignore-space-change --ignore-whitespace ../../../../patches/lame4j-svc/*.patch; popd
      - name: Apply speex4j-svc patches
        run: |
          pushd ./app/src/main/speex4j-svc; git apply --verbose --ignore-space-change --ignore-whitespace ../../../../patches/speex4j-svc/*.patch; popd
      - name: Fetch PhysX JNI binary
        run: |
          set +e
          URL="https://github.com/fabmax/physx-jni/releases/download/v2.5.1/physx-jni-android-release.aar"
          curl -fL --retry 3 -o physx-jni-android-release.aar "$URL"
          unzip -q physx-jni-android-release.aar -d physx-jni
          SO="physx-jni/jni/arm64-v8a/libPhysXJniBindings_64.so"
          if [ ! -f "$SO" ]; then
            echo "::warning::$SO was not found"
            echo "### ⚠️ PhysX JNI Fetch Failed" >> $GITHUB_STEP_SUMMARY
          else
            mkdir -p app/src/main/jniLibs/arm64-v8a
            cp "$SO" app/src/main/jniLibs/arm64-v8a/
          fi
      - name: Build
        run: gradle :app:assembleRelease -PEXTRA_CMAKE_ARGS="-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache"
      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libraries-release
          path: app/build/outputs/aar/app-release.aar
